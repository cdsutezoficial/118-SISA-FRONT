# NGINX para el front de SISA (React + Vite, SPA con React Router).
# Sustuye el default.conf de la imagen oficial.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Compresion ────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── Archivos con hash en el nombre (/assets/index-Bt9ZYD2R.js) ────
    # Vite les pone hash al contenido, asi que se cachean para siempre:
    # un despliegue nuevo genera nombres nuevos y el cache se invalida solo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── index.html nunca se cachea ────────────────────────────────────
    # Es el archivo que apunta a los bundles con hash: si se cachea, el
    # navegador sigue pidiendo los bundles de un despliegue anterior.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # ── Rutas del router del lado del cliente ────────────────────────
    # /portal/..., /admision/... etc. no existen en disco: se responde
    # index.html y es React quien resuelve la ruta. Sin esto, recargar
    # en cualquier pantalla que no sea el inicio daria 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
